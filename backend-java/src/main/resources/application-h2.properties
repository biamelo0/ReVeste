# Configuração alternativa caso deseje rodar offline com H2 em memória:
# Ative passando: --spring.profiles.active=h2
server.port=8080
spring.application.name=reveste-api
spring.datasource.url=jdbc:h2:mem:revestedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
