# ===================================================================
# Configurações do Servidor
# ===================================================================
server.port=8080
server.servlet.context-path=/

# Nome da Aplicação
spring.application.name=reveste-api

# ===================================================================
# Banco de Dados PostgreSQL na Nuvem (Supabase)
# ===================================================================
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres.nebknibfzdfhjordpijb
spring.datasource.password=Reveste2026Fatec!

# Pool de Conexões Hikari (Otimizado para o Supabase Pooler)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# Configurações do Hibernate / JPA (PostgreSQL)
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Desativa inicialização de scripts SQL manuais para não conflitar com tabelas existentes
spring.sql.init.mode=never

# ===================================================================
# Swagger / OpenAPI (Springdoc)
# ===================================================================
# Swagger UI disponível em: http://localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.path=/v3/api-docs
